    - torchvision==0.18.0+rocm6.0
    - anemoi.datasets==0.5.15
    - anemoi.graphs==0.4.2
    - anemoi.models==0.4.1
    - anemoi.training==0.3.2
    - anemoi.utils==0.4.11
    - pyrsmi
    - ipykernel