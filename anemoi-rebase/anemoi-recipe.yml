name: anemoi
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/
    - pytorch-triton-rocm==3.1.0
    - torch==2.5.1+rocm6.2
    - torchaudio==2.5.1+rocm6.2
    - torchvision==0.20.1+rocm6.2
    - anemoi-utils
    - anemoi-transform
    - anemoi-datasets
    - anemoi-graphs
    - anemoi-models
    - anemoi-training
    - anemoi-inference
    - cartopy
    - ipykernel
    - xskillscore